name: CI

on:
  push:
    branches:
      - main
      - gabriel-reference
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify modules
        run: go mod verify
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Cross-build Windows release targets
        run: |
          set -euo pipefail
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/m365-native-windows-amd64.exe ./cmd/server
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/m365-native-windows-arm64.exe ./cmd/server
      - name: Check NAS deployment automation
        run: |
          set -euo pipefail
          bash -n scripts/deploy-nas-production.sh
          bash scripts/deploy-nas-production.sh --help >/dev/null
