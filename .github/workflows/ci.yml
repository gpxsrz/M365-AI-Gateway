name: CI

on:
  push:
    branches:
      - main
      - gabriel-reference
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --release
      - name: Check container build
        run: docker build -t m365-ai-gateway-ci .
      - name: Check NAS deployment automation
        run: |
          set -euo pipefail
          bash -n scripts/deploy-nas-production.sh
          bash -n scripts/test-deploy-nas-production.sh
          bash scripts/deploy-nas-production.sh --help >/dev/null
          bash scripts/test-deploy-nas-production.sh
