name: Stable Release

on:
  push:
    tags:
      - 'stable-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      stable:
        description: 'Confirm this is an explicitly declared stable release'
        required: true
        type: boolean
        default: false
      tag:
        description: 'Release tag, for example stable-v0.1.0'
        required: true
        type: string

permissions:
  contents: write

env:
  BINARY_NAME: m365-native

jobs:
  package:
    name: Build stable binaries
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.stable == true)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: linux-amd64
            extension: ''
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: linux-arm64
            extension: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-amd64
            extension: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: windows-arm64
            extension: .exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: darwin-amd64
            extension: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: darwin-arm64
            extension: ''
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve build identity
        shell: bash
        env:
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then tag="${INPUT_TAG}"; fi
          if [[ ! "${tag}" =~ ^stable-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use stable-vX.Y.Z, got: ${tag}"
            exit 1
          fi
          echo "M365_BUILD_VERSION=${tag#stable-v}" >> "${GITHUB_ENV}"
          echo "M365_BUILD_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "M365_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"

      - name: Build
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          toolchain: '1.97'
          args: --locked --release

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}${{ matrix.extension }}" \
            "dist/${BINARY_NAME}-${{ matrix.artifact }}${{ matrix.extension }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish stable Release
    needs: package
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.stable == true)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.BINARY_NAME }}-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Resolve release tag
        id: tag
        env:
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then tag="${INPUT_TAG}"; fi
          if [[ ! "${tag}" =~ ^stable-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use stable-vX.Y.Z, got: ${tag}"
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Stable ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*
