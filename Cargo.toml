[package]
name = "m365-ai-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[[bin]]
name = "m365-native"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
futures-util = "0.3.31"
httpdate = "1.0.3"
jsonschema = { version = "0.49.9", default-features = false }
rand = "0.9.2"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "multipart", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting", "serde", "serde-well-known"] }
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
