name: m365-recall-provenance
version: "1.3.0"
description: "Bind Hermes-injected recall source material and internal empty-response recovery control to the exact M365 request, using the stock execution session identity rather than inherited routing context."
author: gpxsrz/M365-AI-Gateway
requires_env:
  - M365_HERMES_RECALL_PROVENANCE_SECRET
  - M365_HERMES_PROVIDER
  - M365_HERMES_GATEWAY_BASE_URL
hooks:
  - pre_llm_call
  - post_llm_call
  - on_session_end
  - transform_api_error_classification
