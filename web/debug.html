<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M365 Copilot2API · 診斷摘要</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--surface:#fff;--line:#d2d2d7;--text:#1d1d1f;--muted:#6e6e73;--accent:#0071e3;--danger:#b42318;--warn:#9a6700;--radius:12px}@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--surface:#2c2c2e;--line:#48484a;--text:#f5f5f7;--muted:#aeaeb2;--accent:#0a84ff;--danger:#ff6961;--warn:#ffd60a}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1200px;margin:0 auto;padding:28px 20px}h1{margin:0 0 4px;font-size:24px}.muted{color:var(--muted)}.warning{margin:18px 0;padding:14px;border:1px solid var(--warn);border-radius:var(--radius);background:color-mix(in srgb,var(--warn) 8%,transparent)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.button{border:1px solid var(--line);border-radius:8px;padding:8px 13px;background:var(--surface);color:var(--text);font:inherit;font-weight:600;cursor:pointer}.button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.button.danger{color:var(--danger)}.session{padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}tr[data-id]{cursor:pointer}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.hidden{display:none}.detail{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}pre{overflow:auto;max-height:460px;padding:14px;border-radius:8px;background:var(--bg);white-space:pre-wrap}.pill{display:inline-block;padding:2px 7px;border-radius:999px;border:1px solid var(--line);font-size:11px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0}.card{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}@media(max-width:760px){main{padding:16px 10px}.table-wrap{overflow-x:auto}th,td{white-space:nowrap}}
</style>
</head>
<body>
<main>
<h1>診斷摘要</h1>
<p class="muted">預設只保存結構化摘要，不保存完整 prompt、response、tool arguments、附件內容或 request headers。</p>
<div class="warning"><strong>短期診斷快照</strong><div id="warningText">快照會移除所有 scalar 正文，並在到期後自動清除。</div></div>
<div class="toolbar">
<button class="button primary" onclick="startSession()">啟用 15 分鐘診斷</button>
<button class="button danger" onclick="clearSession()">停止並清除快照</button>
<button class="button" onclick="exportSummary()">匯出去敏摘要</button>
<button class="button" onclick="load()">重新整理</button>
<a class="button" href="/">返回管理介面</a>
</div>
<div id="session" class="session">載入診斷狀態中…</div>
<div class="grid">
<div class="card">摘要筆數<strong id="recordCount">—</strong></div>
<div class="card">輸入估算 Token<strong id="inputTokens">—</strong></div>
<div class="card">輸出估算 Token<strong id="outputTokens">—</strong></div>
<div class="card">可查看快照<strong id="snapshotCount">—</strong></div>
</div>
<section id="list">
<div class="table-wrap"><table><thead><tr><th>時間</th><th>協定</th><th>路由</th><th>狀態</th><th>耗時</th><th>結構</th><th>快照</th><th>ID</th></tr></thead><tbody id="rows"></tbody></table></div>
<h2>去敏稽核事件</h2>
<div class="table-wrap"><table><thead><tr><th>時間</th><th>操作</th><th>結果</th><th>Session</th><th>Record</th></tr></thead><tbody id="auditRows"></tbody></table></div>
</section>
<section id="detail" class="detail hidden">
<button class="button" onclick="showList()">返回列表</button>
<h2 id="detailTitle"></h2>
<div id="detailSummary" class="grid"></div>
<h3>深度去敏結構快照</h3>
<p class="muted">只顯示格式、大小、型別與深度統計；所有 scalar 值、未知欄位名稱與 request headers 均已移除。</p>
<pre id="snapshot">這筆摘要沒有快照。</pre>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let records=[],audit=[];
const fmtTime=value=>value?new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(value)):'—';
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){options.headers={'Content-Type':'application/json',...(options.headers||{})};const response=await fetch(url,options);const text=await response.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={error:{message:text}}}if(!response.ok)throw new Error(data?.error?.message||text||'請求失敗');return data}
function renderSession(session){$('warningText').textContent=session.warning||'快照會深度去敏並自動到期。';$('session').innerHTML=session.active?'<strong>診斷中</strong> · 到期時間 '+esc(fmtTime(session.expiresAt))+' · '+esc(session.capturedRecords)+' / '+esc(session.maxRecords)+' 筆 · '+esc(session.capturedBytes)+' / '+esc(session.maxBytes)+' bytes':'<strong>未啟用診斷快照</strong> · 目前只保存結構化摘要。'}
async function load(){try{const data=await api('/api/admin/debug/logs');records=data.records||[];audit=data.audit||[];renderSession(data.session||{});$('recordCount').textContent=records.length;$('inputTokens').textContent=records.reduce((sum,item)=>sum+(item.inputTokens||0),0);$('outputTokens').textContent=records.reduce((sum,item)=>sum+(item.outputTokens||0),0);$('snapshotCount').textContent=records.filter(item=>item.snapshotAvailable).length;$('rows').innerHTML=records.map(item=>'<tr data-id="'+esc(item.id)+'" onclick="showDetail(\''+esc(item.id)+'\')"><td>'+esc(fmtTime(item.at))+'</td><td><code>'+esc(item.protocol)+'</code><div class="muted">'+esc(item.method)+' '+esc(item.path)+'</div></td><td><code>'+esc(item.route)+'</code></td><td><span class="pill">'+esc(item.status)+'</span><div class="muted">'+esc(item.errorCode||item.level)+'</div></td><td>'+esc(item.durationMs)+' ms</td><td>訊息 '+esc(item.messageCount)+' · 工具 '+esc(item.toolCount)+' · 附件 '+esc(item.attachmentCount)+' · 事件 '+esc(item.eventCount)+'</td><td>'+(item.snapshotAvailable?'到期 '+esc(fmtTime(item.snapshotExpiresAt)):'—')+'</td><td><code>'+esc(item.id)+'</code></td></tr>').join('')||'<tr><td colspan="8" class="muted" style="text-align:center;padding:36px">目前沒有診斷摘要</td></tr>';$('auditRows').innerHTML=audit.map(item=>'<tr><td>'+esc(fmtTime(item.at))+'</td><td><code>'+esc(item.action)+'</code></td><td>'+esc(item.result)+'</td><td><code>'+esc(item.sessionId||'—')+'</code></td><td><code>'+esc(item.recordId||'—')+'</code></td></tr>').join('')||'<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">目前沒有稽核事件</td></tr>'}catch(error){$('session').textContent=error.message}}
async function startSession(){try{const session=await api('/api/admin/debug/session',{method:'POST',body:JSON.stringify({ttlSeconds:900})});renderSession(session);await load()}catch(error){alert(error.message)}}
async function clearSession(){if(!confirm('停止診斷工作階段並立即清除所有短期快照？結構化摘要會依原 TTL 保留。'))return;try{const session=await api('/api/admin/debug/session',{method:'DELETE'});renderSession(session);await load()}catch(error){alert(error.message)}}
async function exportSummary(){try{const data=await api('/api/admin/debug/export',{method:'POST',body:'{}'});const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='m365-debug-redacted.json';link.click();URL.revokeObjectURL(link.href)}catch(error){alert(error.message)}}
async function showDetail(id){try{const item=await api('/api/admin/debug/detail?id='+encodeURIComponent(id));$('list').classList.add('hidden');$('detail').classList.remove('hidden');$('detailTitle').textContent=item.protocol+' · '+item.route;$('detailSummary').innerHTML='<div class="card">請求 ID<strong>'+esc(item.requestId||'—')+'</strong></div><div class="card">HTTP<strong>'+esc(item.status)+'</strong></div><div class="card">輸入估算 Token<strong>'+esc(item.inputTokens)+'</strong></div><div class="card">輸出估算 Token<strong>'+esc(item.outputTokens)+'</strong></div><div class="card">事件數<strong>'+esc(item.eventCount)+'</strong></div><div class="card">快照到期時間<strong>'+esc(fmtTime(item.snapshotExpiresAt))+'</strong></div>';$('snapshot').textContent=item.snapshot?JSON.stringify(item.snapshot,null,2):'這筆摘要沒有快照。'}catch(error){alert(error.message)}}
function showList(){$('detail').classList.add('hidden');$('list').classList.remove('hidden')}
load();
</script>
</body>
</html>
